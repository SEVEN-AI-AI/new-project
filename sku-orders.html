<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单明细 · 美客多ERP</title>
  <link rel="stylesheet" href="./styles.css?v=2026112403" />
  <link rel="stylesheet" href="./dashboard.css?v=2026112403" />
</head>
<body class="dash-page">
  <div class="shell">
    <header class="app-header dash-header">
      <div class="dash-brand">
        <div class="brand-mark">D</div>
        <div><h1>订单明细</h1><p>每日订单数据 · SKU 筛选查看</p></div>
      </div>
      <div class="header-right">
        <span class="header-time" id="dash-time"></span>
        <a class="ghost-btn" href="./erp.html">返回 ERP</a>
      </div>
    </header>

    <main class="main dash-main">
      <nav class="module-nav">
        <a href="./store-overview.html">整体店铺数据</a>
        <a href="./sku-orders.html" class="active">订单明细</a>
        <a href="./data-import.html">订单明细导入</a>
      </nav>

      <section class="panel dash-filter-panel">
        <div class="dash-filter-row">
          <div class="filter-group">
            <label for="order-sku-filter">SKU 筛选</label>
            <select id="order-sku-filter"><option value="">全部 SKU</option></select>
          </div>
          <div class="filter-group">
            <label for="order-days">时间范围</label>
            <select id="order-days">
              <option value="7">近 7 天</option>
              <option value="14">近 14 天</option>
              <option value="30" selected>近 30 天</option>
              <option value="90">近 90 天</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="dash-store">店铺</label>
            <select id="dash-store"><option value="">全部店铺</option></select>
          </div>
          <div class="filter-group">
            <label for="order-metric">图表指标</label>
            <select id="order-metric">
              <option value="orders" selected>订单数</option>
              <option value="gmv">GMV ($)</option>
            </select>
          </div>
          <button class="primary-btn" type="button" id="dash-refresh">刷新数据</button>
        </div>
        <div class="dash-filter-note" id="order-summary">--</div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>每日订单柱状图</h3><span id="chart-hint">横轴=日期，鼠标悬停查看明细</span></div>
        <div class="dash-chart" id="order-chart"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>每日订单明细</h3><span id="detail-count">--</span></div>
        <div class="table-wrap dash-table-wrap">
          <table class="dash-table" id="order-detail-table">
            <thead>
              <tr><th>日期</th><th>SKU</th><th>商品名称</th><th>店铺</th><th>订单数</th><th>GMV ($)</th><th>客单价</th></tr>
            </thead>
            <tbody id="order-detail-tbody"><tr><td colspan="7" class="empty-cell">加载中...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="./dashboard-common.js?v=2026112403"></script>
  <script src="./sku-orders.js?v=2026112403"></script>
</body>
</html>
