<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店铺经营总览 · 美客多ERP</title>
  <link rel="stylesheet" href="./styles.css?v=2026112402" />
  <link rel="stylesheet" href="./dashboard.css?v=2026112402" />
</head>
<body class="dash-page">
  <div class="shell">
    <header class="app-header dash-header">
      <div class="dash-brand">
        <div class="brand-mark">D</div>
        <div><h1>店铺经营总览</h1><p>GMV · 广告花费 · ROI · TACOS</p></div>
      </div>
      <div class="header-right">
        <span class="header-time" id="dash-time"></span>
        <a class="ghost-btn" href="./erp.html">返回 ERP</a>
      </div>
    </header>

    <main class="main dash-main">
      <nav class="module-nav">
        <a href="./store-overview.html" class="active">店铺经营总览</a>
        <a href="./sku-orders.html">SKU 出单分析</a>
        <a href="./data-import.html">数据导入中心</a>
      </nav>

      <section class="panel dash-filter-panel">
        <div class="dash-filter-row">
          <div class="filter-group">
            <label>统计周期</label>
            <div class="seg" id="period-seg">
              <button type="button" class="seg-btn active" data-period="day">日</button>
              <button type="button" class="seg-btn" data-period="week">周</button>
              <button type="button" class="seg-btn" data-period="month">月</button>
            </div>
          </div>
          <div class="filter-group">
            <label for="dash-date">日期</label>
            <input id="dash-date" type="date" />
          </div>
          <div class="filter-group">
            <label for="dash-store">店铺</label>
            <select id="dash-store"><option value="">全部店铺</option></select>
          </div>
          <div class="filter-group">
            <label>对比</label>
            <div class="seg" id="compare-seg">
              <button type="button" class="seg-btn active" data-compare="mom">环比</button>
              <button type="button" class="seg-btn" data-compare="yoy">同比</button>
            </div>
          </div>
          <button class="primary-btn" type="button" id="dash-refresh">刷新数据</button>
        </div>
        <div class="dash-filter-note">
          数据口径：GMV = SKU 订单产品收入(USD)；广告花费来自广告数据；ROI = GMV / 广告花费；TACOS = 广告花费 / GMV
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>核心指标</h3><span id="overview-range">--</span></div>
        <div class="kpi-grid dash-kpi-grid" id="overview-kpis"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>GMV / 广告花费趋势</h3><span id="trend-legend">柱=GMV，线=广告花费</span></div>
        <div class="dash-chart" id="overview-chart"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h3>指标明细</h3><span>当前周期 vs 对比周期</span></div>
        <div class="table-wrap dash-table-wrap">
          <table class="dash-table" id="compare-table">
            <thead><tr><th>指标</th><th>当前</th><th id="compare-col-title">上期</th><th>变化</th></tr></thead>
            <tbody id="compare-tbody"><tr><td colspan="4" class="empty-cell">加载中...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="./dashboard-common.js?v=2026112402"></script>
  <script src="./store-overview.js?v=2026112402"></script>
</body>
</html>
